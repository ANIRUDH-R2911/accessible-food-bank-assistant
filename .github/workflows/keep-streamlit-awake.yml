
name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '23 */8 * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit Streamlit App
        env:
          APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]

          if not url:
              raise ValueError("STREAMLIT_APP_URL is not configured")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              try:
                  page.goto(
                      url,
                      timeout=60000,
                      wait_until="domcontentloaded"
                  )

                  page.wait_for_timeout(15000)

                  wake_btn = page.get_by_role(
                      "button",
                      name="Yes, get this app back up!"
                  )

                  if wake_btn.count() > 0 and wake_btn.is_visible():
                      print("App is sleeping. Attempting to wake it...")
                      wake_btn.click()
                      page.wait_for_timeout(30000)
                  else:
                      print("App is already accessible.")

                  print("Streamlit app visit completed.")

              finally:
                  browser.close()
          PY
